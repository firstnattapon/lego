name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
      - 'agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pip-audit
      # A new advisory is a release-safety signal, not an unrelated failure.
      # 2026-09-05 this gate caught five advisories in the previous crypto pin.
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: python -m py_compile *.py tools/*.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools
      - run: >-
          firebase emulators:exec --only database
          --project demo-lego-firebase
          "python -m pytest -q test_database_rules.py"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2 for pull_request events; without
          # it the job errors out instead of scanning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

