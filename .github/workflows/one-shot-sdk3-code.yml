name: One-shot Webull SDK3 code migration

on:
  push:
    branches:
      - fix/webull-sdk3-route-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webull-sdk3-route-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_one_shot_sdk3_patch.py
      - name: Verify focused migration suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m py_compile *.py tools/*.py
          pytest -q test_vendored_webull_wheel.py test_webull_sdk3_contract.py test_webull_account_assets.py test_webull_io.py test_broker_smoke.py
          pip check
          git diff --check
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt vendor/README.md webull_io.py conftest.py test_vendored_webull_wheel.py test_webull_account_assets.py test_webull_sdk3_contract.py test_webull_io.py tools/build_release_evidence.py docs/WEBULL_SDK3_ROUTE_MIGRATION_20260916.md
          git commit -m 'fix: migrate Webull money path to SDK 3.0.1 routes'
          git push origin HEAD:fix/webull-sdk3-route-contract
