          Path('vendor/README.md').write_text('''# Vendored Webull SDK wheel

`webull_openapi_python_sdk-3.0.1-1lego-py3-none-any.whl` is rebuilt from the
official Webull `3.0.1` PyPI wheel.

Why: the current Webull Thailand documentation and SDK use the v3 route
contracts for authentication, accounts, orders and market data, while the old
2.0.15 runtime still generated legacy `/openapi/...` v2 requests. The upstream
3.0.1 wheel also constrains Python 3.12 to an older cryptography line than this
repo's audited `cryptography==50.0.0` pin.

The rebuild changes **dependency metadata only**. Every file under `webull/` is
byte-for-byte identical to the official 3.0.1 wheel; only the two cryptography
`Requires-Dist` lines in `METADATA` change and wheel `RECORD` is regenerated.

Provenance and controls:

- official 3.0.1 wheel SHA-256:
  `35abe4ecc65bc80f9de075a83b057a393d6991bae2a00417fc691aa05602694e`
- patched wheel SHA-256:
  `80d631d2decba3680e4cd5c3b8b7898301667397080460186f128e943a361e7a`
- runtime package file count: `299`
- aggregate SHA-256 of all `webull/` runtime files:
  `867063412d0c5acae34cfee9406d52521a3cb2ad8b682a61a06ee517e3ee3552`
- license/notice from the Apache-2.0 upstream wheel remain inside the wheel
- `test_vendored_webull_wheel.py` validates RECORD, constraints and aggregate
  runtime-code provenance

Do not replace this wheel without repeating the complete CI suite and a
read-only UAT broker smoke test. In particular, never retry `place_order` after
an ambiguous broker response.
''', encoding='utf-8')

          Path('test_vendored_webull_wheel.py').write_text('''"""Provenance and integrity checks for the metadata-only Webull wheel patch."""
from __future__ import annotations

import base64
import csv
import hashlib
import io
import zipfile
from pathlib import Path


ROOT = Path(__file__).resolve().parent
WHEEL = (
    ROOT / "vendor"
    / "webull_openapi_python_sdk-3.0.1-1lego-py3-none-any.whl"
)
DIST_INFO = "webull_openapi_python_sdk-3.0.1.dist-info"
PATCHED_SHA256 = (
    "80d631d2decba3680e4cd5c3b8b7898301667397080460186f128e943a361e7a"
)
ORIGINAL_RUNTIME_AGGREGATE = (
    "867063412d0c5acae34cfee9406d52521a3cb2ad8b682a61a06ee517e3ee3552"
)


def _record_digest(data: bytes) -> str:
    encoded = base64.urlsafe_b64encode(hashlib.sha256(data).digest())
    return "sha256=" + encoded.rstrip(b"=").decode("ascii")


def test_vendored_wheel_hash_and_runtime_code_provenance():
    assert hashlib.sha256(WHEEL.read_bytes()).hexdigest() == PATCHED_SHA256
    with zipfile.ZipFile(WHEEL) as wheel:
        runtime_names = sorted(
            name for name in wheel.namelist() if name.startswith("webull/"))
        aggregate = b"".join(
            (
                name + "\\0" + hashlib.sha256(wheel.read(name)).hexdigest() + "\\n"
            ).encode()
            for name in runtime_names
        )
    assert len(runtime_names) == 299
    assert hashlib.sha256(aggregate).hexdigest() == ORIGINAL_RUNTIME_AGGREGATE


def test_vendored_wheel_has_a_complete_valid_record():
    with zipfile.ZipFile(WHEEL) as wheel:
        record_name = f"{DIST_INFO}/RECORD"
        rows = {
            row[0]: row[1:]
            for row in csv.reader(
                io.StringIO(wheel.read(record_name).decode("utf-8")))
        }
        assert set(rows) == set(wheel.namelist())
        for name in wheel.namelist():
            if name == record_name:
                assert rows[name] == ["", ""]
                continue
            data = wheel.read(name)
            assert rows[name] == [_record_digest(data), str(len(data))]


def test_vendored_wheel_only_allows_audited_cryptography_floor():
    with zipfile.ZipFile(WHEEL) as wheel:
        metadata = wheel.read(f"{DIST_INFO}/METADATA").decode("utf-8")
        assert "Version: 3.0.1" in metadata
        assert (
            'cryptography<55,>=50.0.0; python_version >= "3.12" '
            'and python_version < "3.14"'
        ) in metadata
        assert (
            'cryptography<55,>=50.0.0; python_version >= "3.14"'
        ) in metadata
        assert (
            f"{DIST_INFO}/licenses/LICENSE" in wheel.namelist()
            and f"{DIST_INFO}/licenses/NOTICE" in wheel.namelist()
        )
