name: One-shot Webull SDK 3.0.1 code migration

on:
  push:
    branches:
      - fix/webull-sdk3-route-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webull-sdk3-route-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SDK 3.0.1 contract migration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected replacement exactly once, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

