          Path('docs/WEBULL_SDK3_ROUTE_MIGRATION_20260916.md').write_text('''# Webull SDK 3.0.1 route migration — 2026-09-16

## Incident

After the account-assets patch, UAT continued to return
`HTTP 417 / OPENAPI_SYSTEM_ERROR` on every scheduled holdings read, with the
safe-read retry exhausting all attempts. One slot also timed out at the same
endpoint. This means the failure was not solved by replacing only the account
positions path.

## Root cause boundary

The application was still running Webull SDK 2.0.15. That runtime generated the
legacy request contract for config/token/order/market-data operations. The
current Webull Thailand documentation tells SDK users to upgrade the official
SDK, and official SDK 3.0.1 carries the current request paths and x-version
values across the whole client.

PR #5 manually constructed only the two account-assets requests. That left the
rest of the authenticated client on the old SDK contract. This migration removes
that split-brain state: SDK 3.0.1 owns account, auth, order and market-data
request construction consistently.

## Safety properties kept

- `OPENAPI_SYSTEM_ERROR` may retry only through the existing safe read/preview
  wrapper.
- `place_market_order()` remains a single broker submission attempt; an
  ambiguous response is never blindly re-sent.
- malformed or missing holdings still fail closed rather than becoming zero.
- account identity must still be non-empty and is stripped before broker calls.
- the vendored SDK wheel keeps official runtime package bytes unchanged; only
  dependency metadata and RECORD are rebuilt for `cryptography==50.0.0`.

## Required UAT verification after merge/deploy

Run the read-only broker smoke with `AUTO_SUBMIT=false`. It must prove the
configured account appears in the authenticated account list, positions can be
read, open orders can be read, and a market snapshot carries a safe price and
source quote time before trade mode is re-enabled.
''', encoding='utf-8')
